name: Maintenance

# One-off jobs, started by hand: Actions -> Maintenance -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        required: true
        options:
          - test-sources                # collect from every source and print what each returned; no analysis, nothing saved (free)
          - rebuild-index-and-exports   # recompute data/archive/index.json and data/exports from the archive (free)
          - backfill-themes             # give themes to archived stories that have none (uses Claude, a few cents)
          - backfill-archive            # rebuild the archive from the git history of the results (free)
          - rebuild-pages               # rebuild every story page, listing, feed and the sitemap from the archive (free)
          - backfill-weekly             # write the weekly digest of every completed week that has none (uses Claude, a few cents each)
          - validation-sample           # a normal update plus a private sample of posts for a validation study (GUIDE.md); size below
      size:
        description: "validation-sample only: how many posts to sample"
        type: string
        default: "300"

permissions:
  contents: write

concurrency:
  group: update-narratives    # never runs at the same time as the hourly update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0        # the archive backfill reads old versions of the results

      - name: Refuse the validation sample on a public repository
        if: inputs.task == 'validation-sample' && github.event.repository.private != true
        run: |
          echo "::error::The validation sample contains excerpts of individuals' posts. On a public repository its artifact is downloadable by any GitHub user. Make the repository private first, or run the sample on your own computer."
          exit 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          case "${{ inputs.task }}" in
            test-sources)              python scripts/pipeline.py --dry-run ;;
            rebuild-index-and-exports) python scripts/rebuild_index.py ;;
            backfill-themes)           python scripts/backfill_themes.py ;;
            backfill-archive)          python scripts/backfill_archive.py ;;
            rebuild-pages)             python scripts/rebuild_pages.py ;;
            backfill-weekly)           python scripts/weekly.py ;;
            validation-sample)         python scripts/pipeline.py --force --validation-sample "${{ inputs.size }}" ;;
          esac

      - name: Upload the validation sample (private repositories only; kept 30 days)
        if: inputs.task == 'validation-sample' && github.event.repository.private == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-sample
          path: validation/
          retention-days: 30
          if-no-files-found: error

      - name: Save results
        run: |
          git config user.name "narrative-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Maintenance: ${{ inputs.task }} $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
