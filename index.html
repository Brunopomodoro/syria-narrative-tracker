<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syria narrative tracker</title>
<meta name="description" content="Hourly overview of what people in Syrian online discussion are talking about, and how they are reacting. Arabic and English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F5F2;
    --ink: #1D262B;
    --muted: #5B666A;
    --faint: #9AA3A6;
    --rule: #D6DCD8;
    --wash: #E9EEEA;
    --neg: #A3303C;
    --neu: #A7ABA3;
    --pos: #2C7663;
    --brass: #8A6420;
    --sans: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
    --display: "IBM Plex Serif", "Noto Naskh Arabic", Georgia, serif;
    --ar-sans: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif;
    --ar-display: "Noto Naskh Arabic", "IBM Plex Sans Arabic", serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #172024; --ink: #E7ECE8; --muted: #A1ACAF; --faint: #6B777B; --rule: #2C383D; --wash: #1E292E;
            --neg: #D8606B; --neu: #6F7670; --pos: #4FAE94; --brass: #D2A95A; }
  }
  html[lang="ar"] { --sans: var(--ar-sans); --display: var(--ar-display); }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 var(--sans); }
  html[lang="ar"] body { font-size: 18px; line-height: 1.75; }
  .ar-text { font-family: var(--ar-sans); }
  .ar-title { font-family: var(--ar-display); font-weight: 600; }
  .en-title { font-family: "IBM Plex Serif", Georgia, serif; font-weight: 500; }
  a { color: inherit; text-decoration-color: var(--brass); text-underline-offset: 3px; }
  a:hover { color: var(--brass); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 2px; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 28px; }

  /* header */
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; padding: 24px 0 20px; }
  .top h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  .top nav { display: flex; gap: 20px; align-items: baseline; color: var(--muted); font-size: .88rem; }
  .top nav a { text-decoration: none; }
  .lang { border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; color: var(--ink); font-size: .85rem; transition: border-color .2s; }
  .lang:hover { border-color: var(--ink); }
  .lang[lang="ar"] { font-family: var(--ar-sans); }
  .lang[lang="en"] { font-family: "IBM Plex Sans", sans-serif; }
  .stale { color: var(--neg); }

  /* hero */
  .hero { padding: 52px 0 56px; border-top: 1px solid var(--rule); }
  .eyebrow { color: var(--muted); font-size: .92rem; margin: 0 0 10px; }
  .mood { font-family: var(--display); font-weight: 500; font-size: clamp(2.4rem, 5.6vw, 3.9rem); line-height: 1.1;
          letter-spacing: -.015em; margin: 0 0 26px; display: inline-block; padding-bottom: 10px;
          background: linear-gradient(var(--tone, var(--neu)), var(--tone, var(--neu))) 0 100% / 100% 4px no-repeat; }
  html[lang="ar"] .mood { letter-spacing: 0; font-weight: 600; line-height: 1.35; }
  .brief { font-size: 1.14rem; line-height: 1.65; max-width: 58ch; margin: 0 0 18px; }
  .meta { color: var(--muted); font-size: .92rem; margin: 0; max-width: 64ch; }
  .meta i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 6px; font-style: normal; }
  .hint { color: var(--muted); font-size: .92rem; margin: 12px 0 0; max-width: 60ch; }
  .notice { color: var(--brass); font-size: .88rem; margin: 0 0 28px; max-width: 64ch; }

  /* sections */
  section { padding: 44px 0 52px; border-top: 1px solid var(--rule); }
  .sec-head { display: flex; justify-content: space-between; align-items: end; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 22px; }
  h2 { font-family: var(--display); font-weight: 600; font-size: 1.7rem; line-height: 1.25; margin: 0; }
  .sub { color: var(--muted); font-size: .92rem; margin: 4px 0 0; }

  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 3px; }
  .seg button { font-size: .85rem; padding: 6px 14px; border-radius: 999px; color: var(--muted); transition: background .2s, color .2s; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* stories */
  .axis-head, .row { display: grid; grid-template-columns: minmax(0, 1fr) 56px minmax(180px, 300px); gap: 20px; align-items: center; }
  .axis-head { font-size: .78rem; color: var(--faint); padding-bottom: 8px; padding-inline-start: 28px; }
  .axis-head .scale { display: flex; justify-content: space-between; }
  .axis-head .key { display: flex; gap: 14px; justify-content: flex-end; grid-column: 1 / 3; }
  .axis-head .key span { display: inline-flex; align-items: center; gap: 6px; }
  .k-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); display: inline-block; }
  .k-ring { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }
  .story { border-top: 1px solid var(--rule); }
  .story:last-child { border-bottom: 1px solid var(--rule); }
  .row { width: 100%; text-align: start; padding: 16px 0; }
  .row:hover .t-main { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 5px; }
  .t { display: flex; gap: 12px; align-items: baseline; min-width: 0; }
  .chev { flex: none; width: 16px; color: var(--faint); transition: transform .3s var(--ease); font-size: .8rem; display: inline-block; }
  html[dir="rtl"] .chev { transform: rotate(180deg); }
  .story.open .chev, html[dir="rtl"] .story.open .chev, details[open] > summary .chev, html[dir="rtl"] details[open] > summary .chev { transform: rotate(90deg); }
  .t-text { min-width: 0; }
  .t-main { font-size: 1.2rem; line-height: 1.35; display: block; }
  .t-alt { font-size: .88rem; color: var(--muted); display: block; margin-top: 2px; }
  .t-alt.en-title { font-size: .9rem; }
  html[dir="ltr"] .t-alt { text-align: left; }
  html[dir="rtl"] .t-alt { text-align: right; }
  .badge { font-size: .74rem; color: var(--brass); margin-inline-start: 8px; font-family: var(--sans); font-weight: 500; white-space: nowrap; }
  .share { font-variant-numeric: tabular-nums; text-align: end; color: var(--ink); font-weight: 500; font-size: .95rem; }

  .db { position: relative; height: 22px; }
  .db::before { content: ""; position: absolute; inset-inline: 0; top: 50%; height: 1px; background: var(--rule); }
  .db .zero { position: absolute; left: 50%; top: 4px; bottom: 4px; width: 1px; background: var(--faint); opacity: .6; }
  .db .gap { position: absolute; top: 50%; height: 2px; margin-top: -1px; background: var(--faint); transition: left .9s var(--ease), width .9s var(--ease); }
  .db .p, .db .o { position: absolute; top: 50%; border-radius: 50%; transform: translate(-50%, -50%); transition: left .9s var(--ease); }
  .db .p { width: 13px; height: 13px; background: var(--c); box-shadow: 0 0 0 2px var(--paper); }
  .db .o { width: 12px; height: 12px; border: 2px solid var(--ink); background: var(--paper); }
  .pending .db .p, .pending .db .o { left: 50% !important; }
  .pending .db .gap { left: 50% !important; width: 0 !important; }

  .detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
  .story.open .detail { grid-template-rows: 1fr; }
  .detail > div { overflow: hidden; }
  .detail-in { padding: 2px 0 30px; padding-inline-start: 28px; display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 12px 44px; }
  .detail-in p { margin: 0 0 14px; max-width: 64ch; }
  .reaction { border-inline-start: 3px solid var(--c, var(--neu)); padding-block: 2px; padding-inline-start: 16px; margin: 0 0 16px; max-width: 62ch; }
  .lbl { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 3px; }
  .framings { list-style: none; margin: 0 0 16px; padding: 0; }
  .framings li { position: relative; padding-inline-start: 14px; margin-bottom: 4px; color: var(--muted); font-size: .95rem; max-width: 62ch; }
  .framings li::before { content: ""; position: absolute; inset-inline-start: 0; top: .8em; width: 6px; height: 1px; background: var(--muted); }
  .flag { color: var(--brass); font-size: .93rem; }
  .side { font-size: .86rem; color: var(--muted); display: grid; gap: 18px; align-content: start; }
  .side b { color: var(--ink); font-weight: 500; }
  .side a { display: block; margin-top: 2px; }
  .spark { display: block; width: 100%; height: 34px; margin-top: 4px; }
  html[dir="rtl"] .spark { transform: scaleX(-1); }
  .spark polyline { fill: none; stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .spark .area { fill: var(--wash); stroke: none; }

  /* week */
  .week { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 40px; align-items: start; }
  .mosaic { display: grid; grid-template-columns: 38px repeat(24, 16px); gap: 3px; align-items: center; outline: none; }
  .mosaic .hr, .mosaic .day { font-size: .72rem; color: var(--faint); line-height: 1; }
  .mosaic .day { white-space: nowrap; overflow: hidden; }
  html[lang="ar"] .mosaic { grid-template-columns: 54px repeat(24, 16px); }
  .tile { width: 16px; height: 16px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--rule); }
  .tile.on { box-shadow: none; cursor: pointer; transition: transform .15s var(--ease); }
  .tile.on:hover { transform: scale(1.25); }
  .tile.sel { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  .mosaic:focus-visible .tile.sel { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--brass); }
  .legend { display: flex; align-items: center; gap: 8px; font-size: .76rem; color: var(--faint); margin-top: 12px; }
  .legend i { width: 80px; height: 7px; border-radius: 4px; background: linear-gradient(to right, var(--neg), var(--neu), var(--pos)); }
  html[dir="rtl"] .legend i { background: linear-gradient(to left, var(--neg), var(--neu), var(--pos)); }
  .hour h3 { font-size: .92rem; font-weight: 500; color: var(--muted); margin: 0 0 4px; }
  .hmood { font-family: var(--display); font-size: 1.8rem; font-weight: 500; line-height: 1.3; margin: 0 0 14px; display: flex; align-items: center; gap: 12px; }
  .hmood i { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .hour ol { margin: 0; padding: 0; list-style: none; }
  .hour li { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-top: 1px solid var(--rule); font-size: .95rem; }
  .hour li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* about */
  details.about summary { cursor: pointer; list-style: none; font-family: var(--display); font-weight: 600; font-size: 1.3rem; display: flex; gap: 12px; align-items: baseline; }
  details.about summary::-webkit-details-marker { display: none; }
  details.about summary .chev { font-family: var(--sans); }
  .about-body { padding-top: 24px; padding-inline-start: 28px; }
  .method { columns: 2 300px; column-gap: 44px; margin-bottom: 28px; }
  .method p { margin: 0 0 14px; break-inside: avoid; color: var(--muted); font-size: .95rem; }
  .method strong { color: var(--ink); font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: start; padding-block: 9px; padding-inline-end: 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-weight: 500; color: var(--muted); }
  .bad { color: var(--neg); }
  footer { padding: 28px 0 56px; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--rule); }
  .empty { padding: 72px 0; max-width: 58ch; border-top: 1px solid var(--rule); }
  .empty h2 { margin-bottom: 12px; }

  @media (max-width: 760px) {
    .wrap { padding: 0 18px; }
    .axis-head { grid-template-columns: 1fr; padding-inline-start: 0; }
    .axis-head .key { grid-column: 1; justify-content: flex-start; }
    .axis-head .scale { margin-inline-start: 28px; }
    .row { grid-template-columns: minmax(0, 1fr) 48px; gap: 8px 12px; }
    .row .db { grid-column: 1 / -1; margin-inline-start: 28px; }
    .detail-in { grid-template-columns: 1fr; }
    .week { grid-template-columns: 1fr; gap: 28px; }
  }
  @media (max-width: 480px) {
    .mosaic { grid-template-columns: 30px repeat(24, minmax(7px, 1fr)); gap: 2px; }
    html[lang="ar"] .mosaic { grid-template-columns: 46px repeat(24, minmax(7px, 1fr)); }
    .tile { width: 100%; height: 11px; border-radius: 2px; }
    .seg button { padding: 6px 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="site-title">Syria narrative tracker</h1>
    <nav>
      <span id="updated" aria-live="polite"></span>
      <a href="#about" id="about-link">About</a>
      <button class="lang" id="lang-btn"></button>
    </nav>
  </header>
  <main id="app"></main>
  <footer id="footer"></footer>
</div>

<script>
/* =================== words =================== */
const T = {

      ["قد يخطئ الذكاء الاصطناعي", "في فهم السخرية واللهجة والسياق. تعامل مع النبرة كمؤشر تقريبي، واقرأ الأمثلة المرفقة."]],
    source: "المصدر", type: "النوع", status: "الحالة", working: (n) => `يعمل، المنشورات الحديثة: ${n}`, notWorking: "لا يعمل حالياً",
    types: { telegram: "قناة تيليغرام", telegram_comments: "تعليقات تيليغرام", telegram_groups: "مجموعة تيليغرام", news: "موقع إخباري", youtube: "تعليقات يوتيوب", x: "منشورات X" },
    footer: "تُكتب الملخصات تلقائياً بواسطة نموذج ذكاء اصطناعي انطلاقاً من منشورات عامة، وهي تصف ما يُقال، لا ما هو صحيح.",
    emptyTitle: "لا نتائج بعد",
    emptyBody: "ستظهر النتائج الأولى هنا خلال ساعة.",
    emptySub: "تتحقق هذه الصفحة من وجود نتائج جديدة كل ١٠ دقائق.",
    locale: "ar-SY"
  }
};

/* =================== state & helpers =================== */
const TZ = "Asia/Damascus";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https:\/\//i.test(u || "") ? u : "";
const has = (v) => v !== null && v !== undefined && v !== "";
const state = { latest: null, history: [], sort: "share", open: new Set(), sel: null, first: true, lang: null };
const L = () => T[state.lang];
const rtl = () => state.lang === "ar";
const cap = (s) => { s = String(s || "").trim(); return s ? s[0].toUpperCase() + s.slice(1) : s; };
const num = (n) => Number(n || 0).toLocaleString(L().locale);
const pctText = (v) => Math.round((v || 0) * 100).toLocaleString(L().locale) + (rtl() ? "٪" : "%");

/* pick the right-language version of a field; if it is missing, fall back to the other language and remember it */
let usedFallback = false;
const filled = (v) => has(v) && (!Array.isArray(v) || v.length > 0);
function tx(obj, field) {
  if (!obj) return "";
  const ar = obj[field + "_ar"], en = obj[field];
  if (rtl()) {
    if (filled(ar)) return ar;
    if (filled(en)) { usedFallback = true; return en; }
    return Array.isArray(en) ? [] : "";
  }
  return filled(en) ? en : (filled(ar) ? ar : (Array.isArray(ar) ? [] : ""));
}
function titleMain(n) {
  if (!rtl()) return n.title || n.title_ar;
  if (!n.title_ar && n.title) usedFallback = true;
  return n.title_ar || n.title;
}
/* mood words are never mixed across languages: if missing, use the translated tone label */
function moodIn(obj, field, tone) {
  const v = rtl() ? obj?.[field + "_ar"] : obj?.[field];
  return cap(v) || toneLabel(tone);
}
function srcName(name) {
  name = String(name || "");
  if (!rtl()) return name;
  const map = state.latest?.source_names_ar || {};
  if (map[name]) return map[name];
  let m;
  if ((m = name.match(/^Comments on (.+)$/))) return "تعليقات على " + srcName(m[1]);
  if ((m = name.match(/^Group: (.+)$/))) return "مجموعة: " + srcName(m[1]);
  return { "YouTube comments": "تعليقات يوتيوب", "X posts": "منشورات X", "X search": "منشورات X",
           "Telegram connection": "الاتصال بتيليغرام" }[name] || name;
}
const titleAlt = (n) => rtl() ? (n.title_ar ? n.title : "") : (n.title ? n.title_ar : "");

function pickLang(latest) {
  const url = new URLSearchParams(location.search).get("lang");
  if (url === "ar" || url === "en") return url;
  try { const s = localStorage.getItem("snt-lang"); if (s === "ar" || s === "en") return s; } catch (e) {}
  return latest?.default_language === "ar" ? "ar" : "en";
}
function applyLang() {
  const t = L();
  document.documentElement.lang = state.lang;
  document.documentElement.dir = rtl() ? "rtl" : "ltr";
  const title = (rtl() ? state.latest?.site_title_ar : state.latest?.site_title) || t.title;
  $("#site-title").textContent = title;
  document.title = title;
  $("#about-link").textContent = t.about;
  const b = $("#lang-btn");
  b.textContent = t.switchTo;
  b.setAttribute("lang", t.switchLang);
  b.setAttribute("aria-label", t.switchLang === "ar" ? "اعرض الموقع بالعربية" : "Show the site in English");
  $("#footer").textContent = t.footer;
}

/* tone */
const cssv = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rgb = (h) => { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
function toneColor(s) {
  s = Math.max(-1, Math.min(1, Number(s) || 0));
  const c = s < 0 ? mix(rgb(cssv("--neu")), rgb(cssv("--neg")), -s) : mix(rgb(cssv("--neu")), rgb(cssv("--pos")), s);
  return `rgb(${c.join(",")})`;
}
function toneLabel(s) {
  const w = L().tone;
  if (!has(s)) return w[5];
  return s <= -0.5 ? w[0] : s <= -0.15 ? w[1] : s < 0.15 ? w[2] : s < 0.5 ? w[3] : w[4];
}
/* -1..1 -> position in %, mirrored in Arabic so "negative" sits at the reading start */
const pos = (v) => { const p = (Number(v) + 1) * 50; return rtl() ? 100 - p : p; };
const peopleTone = (n) => has(n.public_sentiment) ? n.public_sentiment : null;

/* time */
function ago(iso) {
  const rtf = new Intl.RelativeTimeFormat(L().locale, { numeric: "auto" });
  const m = Math.round((new Date(iso) - Date.now()) / 60000);
  if (Math.abs(m) < 60) return rtf.format(m, "minute");
  const h = Math.round(m / 60);
  return Math.abs(h) < 48 ? rtf.format(h, "hour") : rtf.format(Math.round(h / 24), "day");
}
const fmt = (iso, o) => new Intl.DateTimeFormat(L().locale, { timeZone: TZ, ...o }).format(new Date(iso));
function hourKey(iso) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", hourCycle: "h23" }).formatToParts(new Date(iso)).map(x => [x.type, x.value]));
  return { day: `${p.year}-${p.month}-${p.day}`, hour: Number(p.hour) };
}
const hh = (h) => rtl() ? (String(h).padStart(2, "0") + ":00").replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]) : String(h).padStart(2, "0") + ":00";

/* =================== stories =================== */
function trend(n) {
  if (Date.now() - new Date(n.first_seen) < 2.5 * 3600000) return "New";
  const past = state.history.slice(-13, -1).map(x => (x.narratives || []).find(y => y.id === n.id)?.share || 0);
  if (!past.length) return "New";
  const avg = past.reduce((a, b) => a + b, 0) / past.length;
  if (avg === 0) return "Returning";
  const r = n.share / avg;
  return r > 1.3 ? "Rising" : r < 0.7 ? "Fading" : "Steady";
}
function sparkline(id) {
  const pts = state.history.slice(-48).map(x => (x.narratives || []).find(y => y.id === id)?.volume || 0);
  if (pts.filter(v => v > 0).length < 2) return "";
  const max = Math.max(...pts, 1);
  const line = pts.map((v, i) => `${(i / (pts.length - 1)) * 100},${32 - (v / max) * 29}`).join(" ");
  return `<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true"><polygon class="area" points="0,34 ${line} 100,34"/><polyline points="${line}"/></svg>`;
}
function dumbbell(n) {
  const p = peopleTone(n), o = Number(n.sentiment) || 0, t = L();
  const po = pos(o);
  let h = `<div class="db" role="img" aria-label="${esc(t.people)}: ${esc(toneLabel(p))}. ${esc(t.outlets)}: ${esc(toneLabel(o))}."><span class="zero"></span>`;
  if (p !== null) {
    const pp = pos(p);
    h += `<span class="gap" style="left:${Math.min(pp, po)}%;width:${Math.abs(pp - po)}%"></span>`;
    h += `<span class="o" style="left:${po}%"></span><span class="p" style="left:${pp}%;--c:${toneColor(p)}"></span>`;
  } else h += `<span class="o" style="left:${po}%"></span>`;
  return h + `</div>`;
}
const gapOf = (n) => peopleTone(n) === null ? -1 : Math.abs(peopleTone(n) - n.sentiment);
function sorted(list) {
  const a = [...list];
  if (state.sort === "negative") a.sort((x, y) => (peopleTone(x) ?? x.sentiment) - (peopleTone(y) ?? y.sentiment));
  else if (state.sort === "gap") a.sort((x, y) => gapOf(y) - gapOf(x));
  else a.sort((x, y) => y.share - x.share);
  return a;
}
function storyHTML(n) {
  const t = L(), p = peopleTone(n), tr = trend(n), open = state.open.has(n.id);
  const alt = titleAlt(n);
  const framings = (tx(n, "framings") || []).map(f => `<li dir="auto">${esc(f)}</li>`).join("");
  const flags = tx(n, "flags") || [];
  const emotions = tx(n, "emotions") || [];
  const reaction = tx(n, "public_reaction");
  const links = (n.examples || []).filter(e => safeUrl(e.url)).map(e => `<a href="${esc(e.url)}" target="_blank" rel="noopener" dir="auto">${esc(srcName(e.source))}</a>`).join("");
  const others = (n.sources || []).filter(s => !(n.examples || []).some(e => e.source === s));
  const voices = has(n.public_volume) ? t.voicesCount(num(n.public_volume), num(n.volume - n.public_volume)) : t.postsCount(num(n.volume));
  const mainCls = rtl() ? "ar-title" : "en-title", altCls = rtl() ? "en-title" : "ar-title";
  return `
  <article class="story${open ? " open" : ""}" data-id="${esc(n.id)}">
    <button class="row" aria-expanded="${open}" aria-controls="d-${esc(n.id)}">
      <span class="t"><span class="chev" aria-hidden="true">▶</span>
        <span class="t-text"><span class="t-main ${mainCls}" dir="auto">${esc(titleMain(n))}${tr === "New" || tr === "Rising" ? `<span class="badge">${t.trend[tr]}</span>` : ""}</span>
        ${alt ? `<span class="t-alt ${altCls}" lang="${rtl() ? "en" : "ar"}" dir="${rtl() ? "ltr" : "rtl"}">${esc(alt)}</span>` : ""}</span></span>
      <span class="share">${pctText(n.share)}</span>
      ${dumbbell(n)}
    </button>
    <div class="detail" id="d-${esc(n.id)}"><div><div class="detail-in">
      <div>
        <p dir="auto">${esc(tx(n, "summary"))}</p>
        ${reaction ? `<div class="reaction" style="--c:${p !== null ? toneColor(p) : "var(--neu)"}"><span class="lbl">${t.reacting}</span><span dir="auto">${esc(reaction)}</span></div>` : ""}
        ${framings ? `<span class="lbl">${t.framed}</span><ul class="framings">${framings}</ul>` : ""}
        ${flags.length ? `<p class="flag" dir="auto">${t.watch} ${flags.map(esc).join(rtl() ? "؛ " : "; ")}</p>` : ""}
      </div>
      <div class="side">
        <div><span class="lbl">${t.people}</span><b>${toneLabel(p)}</b>${emotions.length ? `<br><span dir="auto">${emotions.map(esc).join(rtl() ? "، " : ", ")}</span>` : ""}</div>
        <div><span class="lbl">${t.outlets}</span><b>${toneLabel(n.sentiment)}</b></div>
        <div><span class="lbl">${t.last48}</span><b>${t.trend[tr]}</b>${sparkline(n.id)}</div>
        <div><span class="lbl">${t.voicesLbl}</span>${voices}</div>
        ${links || others.length ? `<div><span class="lbl">${t.where}</span>${links}${others.length ? `<span>${others.map(o => `<bdi>${esc(srcName(o))}</bdi>`).join(rtl() ? "، " : ", ")}</span>` : ""}</div>` : ""}
      </div>
    </div></div></div>
  </article>`;
}
function storiesHTML() {
  const t = L(), nars = state.latest.narratives || [], h = num(state.latest.window_hours || 24);
  const btn = (k, label) => `<button data-sort="${k}" aria-pressed="${state.sort === k}">${label}</button>`;
  const scale = [t.negative, t.neutral, t.positive];   // the grid flows right-to-left in Arabic, matching the mirrored chart
  return `
  <section aria-labelledby="h-stories">
    <div class="sec-head">
      <div><h2 id="h-stories">${t.stories}</h2><p class="sub">${t.storiesSub(num(nars.length), h)}</p></div>
      <div class="seg" role="group" aria-label="${t.sortLabel}">${btn("share", t.mostDiscussed)}${btn("negative", t.mostNegative)}${btn("gap", t.biggestGap)}</div>
    </div>
    ${nars.length ? `
    <div class="axis-head" aria-hidden="true">
      <span class="key"><span><i class="k-dot"></i>${t.people}</span><span><i class="k-ring"></i>${t.outlets}</span></span>
      <span class="scale">${scale.map(s => `<span>${s}</span>`).join("")}</span>
    </div>
    <div id="stories" class="${state.first ? "pending" : ""}">${sorted(nars).map(storyHTML).join("")}</div>` : `<p>${t.noStories}</p>`}
  </section>`;
}

/* =================== week =================== */
function weekData() {
  const byHour = new Map();
  for (const h of state.history) { const k = hourKey(h.time); byHour.set(`${k.day}|${k.hour}`, h); }
  const span = state.history.length > 24 * 7 ? 14 : 7;
  const days = Array.from({ length: span }, (_, i) => {
    const d = new Date(Date.now() - i * 86400000).toISOString();
    return { key: hourKey(d).day, label: fmt(d, { weekday: "short" }) };
  });
  const cells = [];
  days.forEach((d) => { for (let h = 0; h < 24; h++) cells.push({ h, day: d, e: byHour.get(`${d.key}|${h}`) || null }); });
  return { days, cells };
}
function hourPanel(c) {
  const t = L();
  if (!c || !c.e) return `<div class="hour"><h3>${t.chooseHour}</h3><p class="sub">${t.chooseHourSub}</p></div>`;
  const e = c.e, top = [...(e.narratives || [])].sort((a, b) => b.share - a.share).slice(0, 4);
  const mood = moodIn(e, "mood", e.sentiment);
  return `<div class="hour" aria-live="polite">
    <h3>${fmt(e.time, { weekday: "long", day: "numeric", month: "long" })}${rtl() ? "، " : ", "}${hh(c.h)}</h3>
    <p class="hmood"><i style="background:${toneColor(e.sentiment)}"></i><span dir="auto">${esc(mood)}</span></p>
    ${top.length ? `<ol>${top.map(n => `<li><span dir="auto">${esc(titleMain(n))}</span><span>${pctText(n.share)}</span></li>`).join("")}</ol>` : ""}
  </div>`;
}
function weekHTML() {
  const t = L(), { days, cells } = weekData();
  if (state.sel === null || !cells[state.sel]?.e) {
    const today = cells.filter(c => c.e && c.day.key === days[0].key);
    const target = today.length ? today[today.length - 1] : cells.find(c => c.e);
    state.sel = target ? cells.indexOf(target) : -1;
  }
  let g = `<span></span>` + Array.from({ length: 24 }, (_, h) => `<span class="hr">${h % 6 === 0 ? (rtl() ? String(h).padStart(2, "0").replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]) : String(h).padStart(2, "0")) : ""}</span>`).join("");
  cells.forEach((c, i) => {
    if (c.h === 0) g += `<span class="day">${esc(c.day.label)}</span>`;
    g += c.e ? `<span class="tile on${i === state.sel ? " sel" : ""}" data-i="${i}" style="background:${toneColor(c.e.sentiment)}" title="${esc(c.day.label)} ${hh(c.h)}"></span>` : `<span class="tile"></span>`;
  });
  return `
  <section aria-labelledby="h-week">
    <div class="sec-head"><div><h2 id="h-week">${days.length === 14 ? t.twoWeeks : t.week}</h2><p class="sub">${t.weekSub}</p></div></div>
    <div class="week">
      <div>
        <div class="mosaic" id="mosaic" tabindex="0" role="group" aria-label="${t.mosaicLabel}">${g}</div>
        <div class="legend"><span>${t.negative}</span><i></i><span>${t.positive}</span></div>
      </div>
      <div id="hour">${hourPanel(cells[state.sel])}</div>
    </div>
  </section>`;
}

/* =================== about =================== */
function aboutHTML() {
  const t = L(), D = state.latest || {};
  const rows = (D.sources || []).map(s => `<tr><td dir="auto">${esc(srcName(s.name))}</td><td>${t.types[s.platform] || esc(s.platform)}</td><td>${
    s.ok ? t.working(num(s.recent ?? s.fetched)) : `<span class="bad" title="${esc(s.error || "")}">${t.notWorking}</span>`}</td></tr>`).join("");
  return `
  <section id="about">
    <details class="about">
      <summary><span class="chev" aria-hidden="true">▶</span>${t.aboutTitle}</summary>
      <div class="about-body">
        <div class="method">${t.method.map(([a, b]) => `<p><strong>${a}</strong> ${b}</p>`).join("")}</div>
        ${rows ? `<table><thead><tr><th>${t.source}</th><th>${t.type}</th><th>${t.status}</th></tr></thead><tbody>${rows}</tbody></table>` : ""}
      </div>
    </details>
  </section>`;
}

/* =================== page =================== */
function heroHTML() {
  const t = L(), D = state.latest, o = D.overall || {}, st = D.stats || {}, h = num(D.window_hours || 24);
  const pub = has(o.public_sentiment) && (st.public_posts || 0) > 0;
  const tone = pub ? o.public_sentiment : o.sentiment;
  const word = pub ? moodIn(o, "public_mood", tone) : moodIn(o, "mood", tone);
  const outletMood = moodIn(o, "mood", o.sentiment);
  const brief = tx(o, "brief");
  const voices = pub ? t.voices(num(st.public_posts), num(st.outlet_posts), h) : t.postsFrom(num(st.posts_analyzed), num(st.sources_ok), h);
  return `
  <div class="hero">
    <!--notice-->
    <p class="eyebrow">${pub ? t.nowPeople : t.nowOutlets}</p>
    <p class="mood" dir="auto" style="--tone:${toneColor(tone)}">${esc(word)}</p>
    ${brief ? `<p class="brief" dir="auto">${esc(brief)}</p>` : ""}
    <p class="meta">${pub && outletMood ? `<i style="background:${toneColor(o.sentiment)}"></i>${t.outletsMeanwhile} <span dir="auto">${esc(outletMood)}</span>. ` : ""}${voices}</p>
    ${pub ? "" : `<p class="hint">${t.hint}</p>`}
  </div>`;
}
function render() {
  applyLang();
  const t = L(), D = state.latest;
  const checked = D.checked_at || D.generated_at;
  const stale = Date.now() - new Date(checked) > 3 * 3600000;
  $("#updated").innerHTML = stale ? `<span class="stale">${t.stale(ago(checked))}</span>` : t.updated(ago(checked));
  const aboutOpen = $("details.about")?.open;
  usedFallback = false;
  let html = heroHTML() + storiesHTML() + weekHTML() + aboutHTML();
  if (usedFallback && t.fallback) html = html.replace("<!--notice-->", `<p class="notice">${t.fallback}</p>`);
  $("#app").innerHTML = html;
  if (aboutOpen) $("details.about").open = true;
  bind();
  if (state.first) {
    state.first = false;
    requestAnimationFrame(() => requestAnimationFrame(() => $("#stories")?.classList.remove("pending")));
  }
}
function bind() {
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    state.sort = b.dataset.sort;
    $("#stories").innerHTML = sorted(state.latest.narratives || []).map(storyHTML).join("");
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    bindRows();
  }));
  bindRows();
  const mosaic = $("#mosaic");
  if (!mosaic) return;
  const { cells } = weekData();
  const select = (i) => {
    if (i < 0 || i >= cells.length || !cells[i].e) return false;
    state.sel = i;
    mosaic.querySelectorAll(".tile.sel").forEach(x => x.classList.remove("sel"));
    mosaic.querySelector(`[data-i="${i}"]`)?.classList.add("sel");
    $("#hour").innerHTML = hourPanel(cells[i]);
    return true;
  };
  mosaic.addEventListener("click", (e) => { const x = e.target.closest(".tile.on"); if (x) select(Number(x.dataset.i)); });
  mosaic.addEventListener("keydown", (e) => {
    let step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 24, ArrowUp: -24 }[e.key];
    if (!step) return;
    if (rtl() && Math.abs(step) === 1) step = -step;      // the grid is mirrored in Arabic
    e.preventDefault();
    for (let i = state.sel + step; i >= 0 && i < cells.length; i += step) if (select(i)) break;
  });
}
function bindRows() {
  document.querySelectorAll(".story .row").forEach(r => r.addEventListener("click", () => {
    const art = r.closest(".story"), id = art.dataset.id, open = !art.classList.contains("open");
    art.classList.toggle("open", open);
    r.setAttribute("aria-expanded", open);
    open ? state.open.add(id) : state.open.delete(id);
  }));
}
function renderEmpty(sources) {
  applyLang();
  const t = L();
  $("#updated").textContent = "";
  $("#app").innerHTML = `<div class="empty"><h2>${t.emptyTitle}</h2><p>${t.emptyBody}</p><p class="sub">${t.emptySub}</p></div>`;
  if (sources && sources.length) { state.latest = { ...(state.latest || {}), sources }; $("#app").insertAdjacentHTML("beforeend", aboutHTML()); $("details.about").open = true; }
}

$("#lang-btn").addEventListener("click", () => {
  state.lang = L().switchLang;
  try { localStorage.setItem("snt-lang", state.lang); } catch (e) {}
  state.latest?.generated_at ? render() : renderEmpty(state.latest?.sources);
});

async function getJSON(path) {
  const r = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function load() {
  let latest = null;
  try { latest = await getJSON("data/latest.json"); } catch (e) {}
  if (!state.lang) state.lang = pickLang(latest);
  if (!latest || !latest.generated_at) { state.latest = latest; return renderEmpty(latest?.sources); }
  let history = [];
  try { history = await getJSON("data/history.json"); } catch (e) {}
  state.latest = latest; state.history = history;
  render();
}
state.lang = null;
