name: Expert view daily brief

# Yesterday's Media and experts brief, ready by 6:00 in Damascus (3:00 UTC; Syria is on UTC+3 all year). It reads
# the newest reports first, then writes the brief. It is started at 2:40 UTC by brief-timer.yml, which GitHub's late
# night schedules cannot delay; the 2:30 UTC schedule below is a second chance, and the first update after 3:00 UTC a
# third. The brief is never written twice.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-narratives    # never at the same time as an update or a maintenance task
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Read the newest reports, then write yesterday's brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          day=$(date -u -d yesterday +%F)
          if python -c "import json,sys; sys.exit(0 if any(x.get('id') == '$day' for x in json.load(open('data/experts/analyses/index.json'))) else 1)"; then
            echo "The brief of $day is already written."
          else
            python scripts/experts.py collect
            python scripts/experts.py daily --if-missing
          fi

      - name: Save results
        run: |
          git config user.name "narrative-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Expert view daily brief $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
            python scripts/indexnow.py || true   # tell search engines which pages changed
          fi
