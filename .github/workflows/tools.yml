name: Maintenance

# One-off jobs, started by hand: Actions -> Maintenance -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        required: true
        options:
          - test-sources                # collect from every source and print what each returned; no analysis, nothing saved (free)
          - rebuild-index-and-exports   # recompute data/archive/index.json and data/exports from the archive (free)
          - backfill-themes             # give themes to archived stories that have none (uses Claude, a few cents)
          - backfill-archive            # rebuild the archive from the git history of the results (free)
          - rebuild-pages               # rebuild every story page, daily brief, digest and report page, listing, feed and the sitemap from the archive (free)
          - backfill-weekly             # write the weekly digest of every completed week that has none, or rewrite the week in 'period' (a few cents each)
          - backfill-monthly            # write the monthly review of every completed month that has none, or rewrite the month in 'period' (about 15 cents each)
          - brand                       # remake the logo files: icons, preview cards, wordmarks (free; after changing the name or tagline)
          - social-check                # check the Facebook and X keys and show the latest posts of each kind; posts nothing (free)
          - backfill-arabic             # translate Arabic text that past updates left out, then rebuild the pages (a cent or two)
          - telegram-probe              # check candidate Telegram channels (names below, or the built-in list): active? Syria-focused? (free)
          - experts-collect             # collect and summarise new reports for the Expert view now (a cent or two)
          - experts-probe               # check every Expert view feed and some alternatives; results in data/experts/probe.json (free)
          - experts-daily               # write the Expert view brief of yesterday, or the day in 'period' (about 10 cents)
          - experts-weekly              # write the Expert view analyses of the last complete week, or the week in 'period' (about 40 cents)
          - experts-monthly             # write the Expert view analyses of the last complete month, or the month in 'period' (about 70 cents)
          - experts-fix-languages       # rewrite in the right language any analysis field written in the other one (a cent or two)
          - words-not-scores            # rewrite the tone scores (-0.15 and so on) in past reports as words, then rebuild the pages (a cent or two a report)
          - site-check                  # the website's health, SEO and security check (free; printed in the log)
          - quality-report              # the tracker's health over the last 7 days compared with the 7 before (free; printed in the log)
          - validation-sample           # a normal update plus a private sample of posts for a validation study (GUIDE.md); size below
      size:
        description: "validation-sample only: how many posts to sample"
        type: string
        default: "300"
      period:
        description: "experts-daily/-weekly/-monthly and backfill-weekly/-monthly only: the day (2026-10-18), week (2026-W42) or month (2026-10) to (re)write; empty: the last complete one"
        type: string
        default: ""
      names:
        description: "telegram-probe only: channel names separated by spaces, or --discover (empty: the built-in candidate list)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: update-narratives    # never runs at the same time as the hourly update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0        # the archive backfill reads old versions of the results

      - name: Refuse the validation sample on a public repository
        if: inputs.task == 'validation-sample' && github.event.repository.private != true
        run: |
          echo "::error::The validation sample contains excerpts of individuals' posts. On a public repository its artifact is downloadable by any GitHub user. Make the repository private first, or run the sample on your own computer."
          exit 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          PROBE_NAMES: ${{ inputs.names }}
          PERIOD: ${{ inputs.period }}
        run: |
          case "${{ inputs.task }}" in
            test-sources)              python scripts/pipeline.py --dry-run ;;
            rebuild-index-and-exports) python scripts/rebuild_index.py ;;
            backfill-themes)           python scripts/backfill_themes.py ;;
            backfill-archive)          python scripts/backfill_archive.py ;;
            rebuild-pages)             python scripts/rebuild_pages.py ;;
            backfill-weekly)           python scripts/weekly.py $(printf '%s' "$PERIOD" | tr -cd '0-9W-') ;;
            backfill-monthly)          python scripts/monthly.py $(printf '%s' "$PERIOD" | tr -cd '0-9W-') ;;
            brand)                     pip install -q fonttools uharfbuzz && python scripts/brand.py ;;
            social-check)              python scripts/social.py --preview ;;
            backfill-arabic)           python scripts/backfill_arabic.py && python scripts/rebuild_pages.py ;;
            telegram-probe)            python scripts/probe_telegram.py $(printf '%s' "$PROBE_NAMES" | tr -cd 'A-Za-z0-9_ -') ;;
            experts-collect)           python scripts/experts.py collect ;;
            experts-daily)             python scripts/experts.py daily $(printf '%s' "$PERIOD" | tr -cd '0-9W-') ;;
            experts-weekly)            python scripts/experts.py weekly $(printf '%s' "$PERIOD" | tr -cd '0-9W-') ;;
            experts-monthly)           python scripts/experts.py monthly $(printf '%s' "$PERIOD" | tr -cd '0-9W-') ;;
            experts-probe)             python scripts/experts.py probe ;;
            experts-fix-languages)     python scripts/experts.py fix-languages ;;
            words-not-scores)          python scripts/words_not_scores.py ;;
            site-check)                python scripts/site_check.py ;;
            quality-report)            python scripts/quality_report.py ;;
            validation-sample)         python scripts/pipeline.py --force --validation-sample "${{ inputs.size }}" ;;
          esac

      - name: Report PDFs (monthly reports and weekly digests, when new or rebuilt)
        run: python scripts/report_pdf.py

      - name: Upload the validation sample (private repositories only; kept 30 days)
        if: inputs.task == 'validation-sample' && github.event.repository.private == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-sample
          path: validation/
          retention-days: 30
          if-no-files-found: error

      - name: Save results
        run: |
          git config user.name "narrative-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Maintenance: ${{ inputs.task }} $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
            python scripts/indexnow.py || true   # tell search engines which pages changed
          fi
