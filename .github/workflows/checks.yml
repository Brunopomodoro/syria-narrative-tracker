name: Checks

# Quick checks on every pull request (and on changes to main), so a typo in the code is caught before it reaches the
# hourly update: Python errors (undefined names, unused imports, syntax), JavaScript syntax, and the site's own
# safety and consistency checks. Free; no secrets; about a minute.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/**", "worker/**", ".github/workflows/**", "config.yaml"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          # the linter, pinned and checked against its published hash like the other packages
          echo "ruff==0.17.3 --hash=sha256:7fa4b0f931cdbcb8a52044f370a3eb429fb42eb88807b0e800fcaa98dd42b24e" > "$RUNNER_TEMP/ruff.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/ruff.txt"

      - name: Python
        run: |
          ruff check scripts --select F,E9 --output-format github
          python -m compileall -q scripts

      - name: JavaScript
        run: |
          for f in assets/*.js; do node --check "$f"; done
          node --input-type=module --check < worker/newsletter.js

      - name: Site checks
        run: |
          python scripts/site_check.py | tee site-check.txt
          if grep -q "^- FAIL" site-check.txt; then echo "::error::site_check found a problem (the FAIL lines above)"; exit 1; fi
