name: Maintenance

# One-off jobs, started by hand: Actions -> Maintenance -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        required: true
        options:
          - rebuild-index-and-exports   # recompute data/archive/index.json and data/exports from the archive (free)
          - backfill-themes             # give themes to archived stories that have none (uses Claude, a few cents)
          - backfill-archive            # rebuild the archive from the git history of the results (free)

permissions:
  contents: write

concurrency:
  group: update-narratives    # never runs at the same time as the hourly update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # the archive backfill reads old versions of the results

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "${{ inputs.task }}" in
            rebuild-index-and-exports) python scripts/rebuild_index.py ;;
            backfill-themes)           python scripts/backfill_themes.py ;;
            backfill-archive)          python scripts/backfill_archive.py ;;
          esac

      - name: Save results
        run: |
          git config user.name "narrative-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Maintenance: ${{ inputs.task }} $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
