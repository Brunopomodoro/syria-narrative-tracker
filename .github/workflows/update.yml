name: Update narratives

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at minute 17 (UTC)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write           # lets the job save new results into the repository

concurrency:
  group: update-narratives
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Skip if the last update is recent (scheduled runs only)
        # GitHub's schedule and the update keeper often fire within an hour of each other; a second update so soon
        # adds little and costs the same. Updates started by hand or by the keeper always run.
        id: gap
        if: github.event_name == 'schedule'
        env:
          MIN_GAP_HOURS: "3"
        run: |
          age=$(python3 -c "import json,datetime as d; g=json.load(open('data/latest.json'))['generated_at']; print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(g.replace('Z','+00:00'))).total_seconds()))" 2>/dev/null || echo 999999)
          if [ "$age" -lt $(( MIN_GAP_HOURS * 3600 )) ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The last update finished $(( age / 60 )) minutes ago; skipping this scheduled run."
          fi

      # Python is set up on every run: posting to X runs hourly, even when the analysis is skipped, so story posts
      # go out at their hours (scripts/social.py decides whether anything is due; most hours nothing is).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect and analyze
        if: steps.gap.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/pipeline.py

      - name: Report and daily brief PDFs (only those new or changed)
        if: steps.gap.outputs.skip != 'true'
        run: python scripts/report_pdf.py

      - name: Post to Facebook and X (each only once its secrets exist; every hour)
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # the X posts are written in a human voice (about a cent each)
        run: python scripts/social.py

      - name: Send the newsletter (once Brevo is set up and newsletter.enabled is true; every hour)
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python scripts/newsletter.py

      - name: Save results
        env:
          SKIPPED: ${{ steps.gap.outputs.skip }}
        run: |
          git config user.name "narrative-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$SKIPPED" = "true" ]; then
            git add data/social.json feed-social.xml feed-social-ar.xml 2>/dev/null || git add data/social.json   # an hour without an update: only the posts' records and feeds change
            git add data/newsletter.json 2>/dev/null || true
            msg="Social posts"
          else
            git add -A
            msg="Update narratives"
          fi
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "$msg $(date -u +'%Y-%m-%d %H:%M UTC')"
            # another run may have saved meanwhile: on a clash in the generated files, this run's newer version wins
            git pull --rebase || { git rebase --abort; git pull --rebase -X theirs; }
            git push
            [ "$SKIPPED" = "true" ] || python scripts/indexnow.py || true   # tell search engines which pages changed
          fi
