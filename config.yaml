# =============================================================
#  Syria Narrative Tracker - settings
#  This is the only file you normally need to edit.
#  Lines starting with # are notes and are ignored.
#  Keep the spacing (indentation) exactly as it is.
# =============================================================

site_title: "Syria Narrative Tracker"
site_title_ar: "متتبّع السرديات السورية"

# How far back to look on every run, in hours. 24 = "the last day".
window_hours: 24

# Which Claude model does the analysis:
#   claude-haiku-4-5-20251001  -> lowest cost, fast (current setting)
#   claude-sonnet-5            -> about twice the cost, more nuanced reading
#                                 of dialect, sarcasm and competing framings
model: "claude-haiku-4-5-20251001"

# The language the website opens in: "en" (English) or "ar" (Arabic).
# Everything is written in both; visitors switch with the button at the top.
default_language: "en"

# Cost control. These two numbers decide most of your monthly bill.
#   max_posts: the most posts sent to Claude per run
#   max_chars_per_post: long posts are cut to this length
max_posts: 300
max_chars_per_post: 400

# Share of the analysis reserved for ordinary people's voices (comments, groups)
# rather than outlets. 0.7 = 70% public, 30% outlets. Unused room is shared.
public_share: 0.7

# Hours of history kept for the trend views and story search (336 = 14 days).
history_hours: 336

# Days of outlet headlines kept for the website's search box.
headline_days: 7

# Words used to keep only Syria-related posts from general sources.
# Only applied to sources below that have "filter: true".
keywords:
  - سوريا
  - سورية
  - سوري
  - السوريين
  - دمشق
  - حلب
  - حمص
  - حماة
  - إدلب
  - درعا
  - السويداء
  - اللاذقية
  - طرطوس
  - دير الزور
  - الرقة
  - الحسكة
  - القامشلي
  - الشرع
  - Syria
  - Syrian
  - Damascus
  - Aleppo
  - Idlib
  - Homs
  - Latakia
  - Deir ez-Zor
  - Raqqa
  - Hasakah
  - Qamishli
  - Suwayda
  - Kobani
  - Afrin
  - SDF
  - قسد
  - عفرين
  - كوباني
  - عين العرب
  - منبج
  - الجولان
  # Kurdish (Kurmanji, Latin script)
  - Sûriye
  - Sûriyê
  - Suriye
  - Rojava
  - Qamişlo
  - Kobanê
  - Efrîn
  - Hesekê
  - Heseke
  - Heleb
  - Reqa
  - Minbic
  - QSD
  # Kurdish (Sorani, Arabic script)
  - سووریا
  - ڕۆژاوا
  - کۆبانێ

# -------------------------------------------------------------
#  SOURCES
#  Two kinds: OUTLETS (what channels and news sites publish) and
#  PUBLIC VOICES (how ordinary people talk and react).
# -------------------------------------------------------------

# ===== OUTLETS =====

# 1) Public Telegram channels - free, no key needed.
#    "name" is the part after t.me/  (https://t.me/SANANewsEnglish -> SANANewsEnglish)
#    Test a channel by opening https://t.me/s/NAME in your browser.
#    If you see posts there, it will work here.
#    Pick popular channels whose posts have COMMENT sections - once the
#    Telegram connection (below) is on, the tracker also reads those comments
#    and the emoji reactions under every post.
#    Aim for balance: official, opposition, Kurdish, Druze, coastal,
#    independent and local city channels, in Arabic and English.
#    Add "comments: false" to a channel to skip reading its comments.
#    "label_ar" (optional) is the source's name on the Arabic version of the site.
#    "kind" groups sources for the search filters on the website:
#    official, independent, kurdish, regional or aggregator.
telegram_channels:
  # --- Official and state
  - name: SANANewsEnglish
    label: "SANA - state news agency (EN)"
    label_ar: "سانا - وكالة الأنباء الرسمية (إنجليزي)"
    filter: false
    kind: official
  - name: SyPresidency
    label: "Syrian Presidency - official"
    label_ar: "رئاسة الجمهورية العربية السورية - رسمي"
    filter: false
    kind: official
  - name: alekhbariahsy
    label: "Al-Ikhbariya Syria - state TV"
    label_ar: "الإخبارية السورية - تلفزيون رسمي"
    filter: false
    kind: official
  - name: SyrianMOI
    label: "Syrian Ministry of Interior - official"
    label_ar: "وزارة الداخلية السورية - رسمي"
    filter: false
    kind: official
  # --- Independent and opposition-origin
  - name: EnabBaladi
    label: "Enab Baladi - independent (AR)"
    label_ar: "عنب بلدي - مستقلة"
    filter: false
    kind: independent
  - name: Enabbaladi_en
    label: "Enab Baladi - independent (EN)"
    label_ar: "عنب بلدي - مستقلة (إنجليزي)"
    filter: false
    kind: independent
  - name: halabtodaytv
    label: "Halab Today TV - opposition-origin, Aleppo"
    label_ar: "قناة حلب اليوم - معارضة سابقاً، حلب"
    filter: false
    kind: independent
  - name: shaamnetwork
    label: "Shaam News Network - opposition-origin"
    label_ar: "شبكة شام الإخبارية - معارضة سابقاً"
    filter: false
    kind: independent
  - name: Levant24
    label: "Levant24 - Syria news (EN)"
    label_ar: "ليفانت 24 - أخبار سوريا (إنجليزي)"
    filter: false
    kind: independent
  # --- Kurdish-run and north-east Syria
  - name: hawarnews
    label: "ANHA (Hawar) - north-east administration news agency (AR)"
    label_ar: "وكالة أنباء هاوار - الإدارة الذاتية (عربي)"
    filter: false
    kind: kurdish
  - name: NPA_Syria
    label: "North Press Agency - Qamishli-based (AR)"
    label_ar: "نورث برس - مقرها القامشلي"
    filter: false
    kind: kurdish
  - name: npasyria
    label: "North Press Agency (EN)"
    label_ar: "نورث برس (إنجليزي)"
    filter: false
    kind: kurdish
  - name: sdf_press
    label: "SDF media center - official"
    label_ar: "المركز الإعلامي لقوات سوريا الديمقراطية - رسمي"
    filter: false
    kind: kurdish
  - name: RudawArabic
    label: "Rudaw Arabic - Kurdistan Region outlet"
    label_ar: "رووداو عربية - إقليم كردستان"
    filter: true
    kind: kurdish
  - name: k24arabic
    label: "Kurdistan24 Arabic - Kurdistan Region outlet"
    label_ar: "كوردستان 24 عربية - إقليم كردستان"
    filter: true
    kind: kurdish
  - name: kurdistan24english
    label: "Kurdistan24 English"
    label_ar: "كوردستان 24 (إنجليزي)"
    filter: true
    kind: kurdish
  # --- Regional outlets (only their Syria posts are kept)
  - name: ajanews
    label: "Al Jazeera - Qatar-based"
    label_ar: "الجزيرة - مقرها قطر"
    filter: true
    kind: regional
  - name: alarabiya
    label: "Al Arabiya - Saudi-owned"
    label_ar: "العربية - مملوكة سعودياً"
    filter: true
    kind: regional
  - name: asharqnews
    label: "Asharq News - Saudi-owned"
    label_ar: "الشرق للأخبار - مملوكة سعودياً"
    filter: true
    kind: regional
  - name: almayadeen
    label: "Al Mayadeen - Beirut-based"
    label_ar: "الميادين - مقرها بيروت"
    filter: true
