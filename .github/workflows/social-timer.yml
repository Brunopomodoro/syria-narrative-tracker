name: Posting timer

# Story posts (on X and in the Facebook Page's feed for Zapier) have set hours (story_hours in config.yaml, Damascus
# time), but they only went out when an update happened to run, and GitHub often runs the hourly update only every
# few hours, so an evening story could come hours late or not at all. Like the daily brief timer, this timer starts
# whenever an update finishes (and from the update keeper): it waits until the next story time and then runs only the
# posting step (scripts/social.py), which decides what is due, exactly as in an update. A newer finished update
# replaces the waiting timer. If the next story time is more than 5.3 hours away, a later update sets the timer.
# If an update is running at that time, the timer leaves the posting to it. Runner time is free for public repositories.
on:
  workflow_run:
    workflows: ["Update narratives"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write           # saves the record of the posts (data/social.json), the feeds and the image cards
  actions: read             # checks whether an update is running

concurrency:
  group: social-timer
  cancel-in-progress: true

jobs:
  wait-then-post:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # GitHub stops any job after 6 hours; the wait stays below that
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Wait until the next story time
        id: wait
        run: |
          wait=$(python scripts/social.py --next-story | tail -n 1); wait=${wait:--1}
          if [ "$wait" -lt 0 ] || [ "$wait" -gt $(( 53 * 360 )) ]; then
            echo "No story time in the next 5.3 hours; a later update will set the timer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          wait=$(( wait + 180 ))   # a few minutes into the hour, so the slot is surely open
          echo "Posting in $(( wait / 60 )) minutes unless a newer update replaces this timer."
          sleep "$wait"

      - name: Post (unless an update is running, which posts itself)
        id: post
        if: steps.wait.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # the X posts are written in a human voice (about a cent each)
        run: |
          busy=$(gh run list --repo "$GH_REPO" --workflow update.yml --limit 10 --json status -q '[.[] | select(.status == "in_progress")] | length' || echo 0)
          if [ "${busy:-0}" -gt 0 ]; then
            echo "An update is running; it posts what is due when it finishes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git pull -q --ff-only   # the newest stories and the newest record of what was posted
          python scripts/social.py

      - name: Save the posts
        if: ${{ !cancelled() && steps.wait.outputs.skip != 'true' && steps.post.outputs.skip != 'true' }}
        run: |
          git config user.name "narrative-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/social.json feed-social.xml feed-social-ar.xml cards 2>/dev/null || git add data/social.json
          if git diff --cached --quiet; then
            echo "Nothing was due."
          else
            git commit -m "Social posts $(date -u +'%Y-%m-%d %H:%M UTC')"
            git stash push --include-untracked -q || true
            git pull --rebase || { git rebase --abort; git pull --rebase -X theirs; }
            git push
          fi
